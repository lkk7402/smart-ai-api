name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production
          GROQ_API_KEY: dummy-key-not-used-in-tests
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80
